<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini PC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; }
    body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #111827, #030712); overflow: hidden; user-select: none; }
    .outer-computer { position: relative; width: 920px; background: #1f2937; padding: 25px; border-radius: 24px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 2px 3px rgba(255, 255, 255, 0.1); border: 2px solid #374151; }
    .outer-screen { position: relative; width: 100%; height: 600px; background: #090d16; border-radius: 16px; border: 4px solid #111827; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9); }
    .mini-computer { width: 840px; background: #111827; border-radius: 20px; padding: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 255, 204, 0.15); border: 1px solid rgba(255, 255, 255, 0.08); }
    .mini-screen { width: 100%; height: 250px; background: #030712; border-radius: 12px; border: 2px solid #00ffcc; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2); margin-bottom: 15px; position: relative; }
    .mini-screen-header { display: flex; justify-content: space-between; color: #9ca3af; font-size: 0.85rem; border-bottom: 1px solid #1f2937; padding-bottom: 5px; }
    .mini-screen-body { height: 190px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ffcc; text-align: center; overflow: hidden; }
    
    /* MENYU VA AMALLAR */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; }
    .menu-btn { background: #059669; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: all 0.2s; box-shadow: 0 4px 0 #047857; }
    .menu-btn:hover { background: #10b981; transform: translateY(-2px); }
    .menu-btn.math { background: #7c3aed; box-shadow: 0 4px 0 #6d28d9; }
    .menu-btn.memory { background: #d97706; box-shadow: 0 4px 0 #b45309; }
    .menu-btn.wordle { background: #2563eb; box-shadow: 0 4px 0 #1d4ed8; }

    /* MEMORY MATRIX */
    .matrix-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 150px; height: 150px; margin-top: 5px; }
    .matrix-cell { background: #1f2937; border-radius: 6px; cursor: pointer; transition: background 0.15s; border: 1px solid #374151; }
    .matrix-cell.active { background: #00ffcc; box-shadow: 0 0 10px #00ffcc; }

    /* WORDLE */
    .wordle-grid { display: flex; flex-direction: column; gap: 4px; margin-bottom: 5px; }
    .wordle-row { display: flex; gap: 4px; }
    .wordle-cell { width: 30px; height: 30px; border: 1px solid #374151; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1rem; border-radius: 4px; background: #111827; color: #fff; }
    .wordle-cell.correct { background: #10b981; color: white; border-color: #10b981; }
    .wordle-cell.present { background: #f59e0b; color: white; border-color: #f59e0b; }
    .wordle-cell.absent { background: #374151; color: #9ca3af; border-color: #374151; }

    /* KLAVIATURA */
    .target-word { font-size: 2rem; letter-spacing: 4px; color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
    .user-input-display { font-size: 1.4rem; min-height: 30px; color: #00ffcc; text-shadow: 0 0 8px rgba(0, 255, 204, 0.6); border-bottom: 2px solid #00ffcc; padding: 0 10px; margin-top: 5px; }
    .mini-keyboard { display: flex; flex-direction: column; gap: 5px; background: #0b0f19; padding: 10px; border-radius: 12px; border: 1px solid #1f2937; }
    .key-row { display: flex; gap: 4px; justify-content: center; }
    .mini-key { background: #1f2937; color: #f3f4f6; border: none; height: 35px; flex: 1; border-radius: 6px; font-weight: bold; font-size: 0.8rem; cursor: pointer; box-shadow: 0 3px 0 #111827; transition: all 0.08s ease; outline: none; }
    .mini-key:hover { background: #374151; color: #00ffcc; }
    .mini-key:active, .mini-key.pressed { transform: translateY(2px); box-shadow: 0 1px 0 #111827; background: #00ffcc !important; color: #000 !important; }
    .mini-key.wide-1 { flex: 1.5; }
    .mini-key.wide-2 { flex: 2; }
    .mini-key.space { flex: 6; }
    .mini-key.action { background: #991b1b; color: #fff; box-shadow: 0 3px 0 #7f1d1d; }
    .mini-key.enter { background: #065f46; color: #fff; box-shadow: 0 3px 0 #064e3b; }
    .action-btn { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; margin: 3px; }
    .action-btn.exit-btn { background: #dc2626; }
  </style>
</head>
<body>

  <div class="outer-computer">
    <div class="outer-screen">
      <div class="mini-computer">
        
        <div class="mini-screen">
          <div class="mini-screen-header">
            <span id="game-title">BOSH MENYU</span>
            <span id="player-tag">ISIM: -</span>
            <span id="timer-tag" style="color: #facc15;">VAQT: -</span>
            <span id="score-tag" style="color: #4ade80;">BALL: 0</span>
          </div>
          <div class="mini-screen-body" id="screen-body"></div>
        </div>

        <div class="mini-keyboard">
          <div class="key-row">
            <button class="mini-key" data-key="1">1</button>
            <button class="mini-key" data-key="2">2</button>
            <button class="mini-key" data-key="3">3</button>
            <button class="mini-key" data-key="4">4</button>
            <button class="mini-key" data-key="5">5</button>
            <button class="mini-key" data-key="6">6</button>
            <button class="mini-key" data-key="7">7</button>
            <button class="mini-key" data-key="8">8</button>
            <button class="mini-key" data-key="9">9</button>
            <button class="mini-key" data-key="0">0</button>
            <button class="mini-key wide-1 action" data-key="Backspace">DEL</button>
          </div>
          <div class="key-row">
            <button class="mini-key" data-key="q">Q</button><button class="mini-key" data-key="w">W</button><button class="mini-key" data-key="e">E</button><button class="mini-key" data-key="r">R</button><button class="mini-key" data-key="t">T</button><button class="mini-key" data-key="y">Y</button><button class="mini-key" data-key="u">U</button><button class="mini-key" data-key="i">I</button><button class="mini-key" data-key="o">O</button><button class="mini-key" data-key="p">P</button>
          </div>
          <div class="key-row">
            <button class="mini-key" data-key="a">A</button><button class="mini-key" data-key="s">S</button><button class="mini-key" data-key="d">D</button><button class="mini-key" data-key="f">F</button><button class="mini-key" data-key="g">G</button><button class="mini-key" data-key="h">H</button><button class="mini-key" data-key="j">J</button><button class="mini-key" data-key="k">K</button><button class="mini-key" data-key="l">L</button><button class="mini-key wide-2 enter" data-key="Enter">ENTER</button>
          </div>
          <div class="key-row">
            <button class="mini-key" data-key="z">Z</button><button class="mini-key" data-key="x">X</button><button class="mini-key" data-key="c">C</button><button class="mini-key" data-key="v">V</button><button class="mini-key" data-key="b">B</button><button class="mini-key" data-key="n">N</button><button class="mini-key" data-key="m">M</button>
          </div>
          <div class="key-row">
            <button class="mini-key space" data-key=" ">SPACE</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const words4 = ["OLMA", "BOLA", "DALA", "DADA", "KEMA", "QOSH", "TOSH", "NONI", "CHOY", "GULI", "KUZI", "SHAH", "OLAM", "IPAK", "VAQT", "RASM", "ASAL", "PAXT", "VATN"];
    const words5 = ["KITOB", "QALAM", "SHAHAR", "QUYOSH", "BULUT", "SHAMOL", "BULOQ", "MEVA", "CHINNI", "OSHPAZ", "BAHOR", "ZAMIN", "INSON", "BILIM", "XALQ"];

    let currentGame = 'MENU';
    let gameState = 'NAME_INPUT';
    let playerName = '';
    let currentInput = '';
    let score = 0;
    let timeLeft = 60;
    let timerInterval = null;

    // TYPING / MATH
    let currentTarget = '';
    let mathAnswer = 0;

    // MEMORY MATRIX
    let matrixPattern = [];
    let userPattern = [];
    let isShowingPattern = false;
    let matrixFlashSpeed = 1200;

    // WORDLE
    let wordleSecret = '';
    let wordleGuesses = [];
    let wordleCurrentRow = 0;

    const screenBody = document.getElementById('screen-body');
    const gameTitle = document.getElementById('game-title');
    const playerTag = document.getElementById('player-tag');
    const timerTag = document.getElementById('timer-tag');
    const scoreTag = document.getElementById('score-tag');

    function renderMainMenu() {
      currentGame = 'MENU';
      gameState = 'NAME_INPUT';
      clearInterval(timerInterval);
      gameTitle.innerText = "BOSH MENYU";
      playerTag.innerText = "ISIM: -";
      timerTag.innerText = "VAQT: -";
      scoreTag.innerText = "BALL: 0";
      currentInput = '';

      screenBody.innerHTML = `
        <div style="font-size: 1rem; margin-bottom: 10px; color: #00ffcc;">O'YINNI TANLANG</div>
        <div class="menu-grid">
          <button class="menu-btn" onclick="selectGame('TYPING')">Chaqqon Barmoqlar</button>
          <button class="menu-btn math" onclick="selectGame('MATH')">Tezkor Matematika</button>
          <button class="menu-btn memory" onclick="selectGame('MEMORY')">Memory Matrix</button>
          <button class="menu-btn wordle" onclick="selectGame('WORDLE')">O'zbekcha Wordle</button>
        </div>
      `;
    }

    function selectGame(gameType) {
      currentGame = gameType;
      gameState = 'NAME_INPUT';
      const titles = { TYPING: "CHAQQON BARMOQLAR", MATH: "TEZKOR MATEMATIKA", MEMORY: "MEMORY MATRIX", WORDLE: "O'ZBEKCHA WORDLE" };
      gameTitle.innerText = titles[gameType];
      screenBody.innerHTML = `
        <div style="font-size: 0.85rem; color: #9ca3af; margin-bottom: 5px;">Ismingizni kiriting va ENTER bosing:</div>
        <div class="user-input-display" id="input-display">_</div>
      `;
    }

    function prepareGame() {
      if (!currentInput.trim()) return;
      playerName = currentInput.trim().toUpperCase();
      playerTag.innerText = `ISIM: ${playerName}`;
      score = 0;
      timeLeft = 60;
      currentInput = '';
      scoreTag.innerText = `BALL: ${score}`;

      if (currentGame === 'WORDLE') {
        initWordle();
      } else if (currentGame === 'MEMORY') {
        initMemory();
      } else {
        gameState = 'READY';
        timerTag.innerText = `VAQT: 60s`;
        nextTask();
      }
    }

    function startTimer() {
      gameState = 'PLAYING';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        timerTag.innerText = `VAQT: ${timeLeft}s`;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function nextTask() {
      currentInput = '';
      if (currentGame === 'TYPING') {
        currentTarget = words4[Math.floor(Math.random() * words4.length)];
      } else if (currentGame === 'MATH') {
        let n1 = Math.floor(Math.random() * 20) + 1, n2 = Math.floor(Math.random() * 20) + 1;
        mathAnswer = n1 + n2;
        currentTarget = `${n1} + ${n2} = ?`;
      }
      screenBody.innerHTML = `
        <div class="target-word">${currentTarget}</div>
        <div class="user-input-display">${currentInput}_</div>
        ${gameState === 'READY' ? '<div style="font-size: 0.75rem; color: #ef4444; margin-top: 4px;">YOZISHNI BOSHLANG</div>' : ''}
      `;
    }

    /* --- MEMORY MATRIX --- */
    function initMemory() {
      gameState = 'PLAYING';
      let level = Math.floor(score / 10) + 1;
      timerTag.innerText = `BOSQICH: ${level}`;
      userPattern = [];
      matrixPattern = [];

      let activeCount = Math.min(3 + Math.floor(score / 20), 6);
      while (matrixPattern.length < activeCount) {
        let r = Math.floor(Math.random() * 9);
        if (!matrixPattern.includes(r)) matrixPattern.push(r);
      }

      matrixFlashSpeed = Math.max(1200 - (level - 1) * 120, 350);
      renderMatrix();
      showMatrixPattern();
    }

    function renderMatrix() {
      let gridHtml = '<div class="matrix-grid">';
      for (let i = 0; i < 9; i++) {
        gridHtml += `<div class="matrix-cell" id="cell-${i}" onclick="clickMatrixCell(${i})"></div>`;
      }
      gridHtml += '</div>';

      screenBody.innerHTML = `
        <div style="font-size:0.8rem; margin-bottom:3px; color:#00ffcc;">
          TEZLIK: ${(1000 / matrixFlashSpeed).toFixed(1)}x | KATAKLAR: ${matrixPattern.length} TA
        </div>
      ` + gridHtml;
    }

    function showMatrixPattern() {
      isShowingPattern = true;
      setTimeout(() => {
        matrixPattern.forEach(idx => {
          let el = document.getElementById(`cell-${idx}`);
          if (el) el.classList.add('active');
        });

        setTimeout(() => {
          matrixPattern.forEach(idx => {
            let el = document.getElementById(`cell-${idx}`);
            if (el) el.classList.remove('active');
          });
          isShowingPattern = false;
        }, matrixFlashSpeed);
      }, 400);
    }

    function clickMatrixCell(idx) {
      if (isShowingPattern || gameState !== 'PLAYING') return;

      let el = document.getElementById(`cell-${idx}`);
      if (el.classList.contains('active')) return;

      el.classList.add('active');
      userPattern.push(idx);

      if (userPattern.length === matrixPattern.length) {
        let isCorrect = JSON.stringify([...userPattern].sort()) === JSON.stringify([...matrixPattern].sort());

        if (isCorrect) {
          score += 10;
          scoreTag.innerText = `BALL: ${score}`;
          setTimeout(() => { initMemory(); }, 400);
        } else {
          endGame(false);
        }
      }
    }

    /* --- WORDLE (TUZATILGAN) --- */
    function initWordle() {
      gameState = 'PLAYING';
      wordleSecret = words5[Math.floor(Math.random() * words5.length)];
      wordleGuesses = Array(5).fill("");
      wordleCurrentRow = 0;
      currentInput = '';
      timerTag.innerText = "IMKON: 5";
      renderWordle();
    }

    function renderWordle() {
      let html = '<div class="wordle-grid">';
      for(let r=0; r<5; r++) {
        html += '<div class="wordle-row">';
        let word = "";
        if (r < wordleCurrentRow) {
          word = wordleGuesses[r];
        } else if (r === wordleCurrentRow) {
          word = currentInput;
        }

        for(let c=0; c<5; c++) {
          let char = word[c] || "";
          let statusClass = "";
          
          if(r < wordleCurrentRow) {
            let guessedWord = wordleGuesses[r];
            if(char === wordleSecret[c]) {
              statusClass = "correct";
            } else if(wordleSecret.includes(char)) {
              statusClass = "present";
            } else {
              statusClass = "absent";
            }
          }
          html += `<div class="wordle-cell ${statusClass}">${char}</div>`;
        }
        html += '</div>';
      }
      html += '</div>';
      screenBody.innerHTML = html;
    }

    function submitWordleGuess() {
      if(currentInput.length !== 5) return;
      
      wordleGuesses[wordleCurrentRow] = currentInput;
      
      if(currentInput === wordleSecret) {
        wordleCurrentRow++;
        renderWordle();
        score += 50;
        scoreTag.innerText = `BALL: ${score}`;
        setTimeout(() => endGame(true), 300);
        return;
      }

      wordleCurrentRow++;
      timerTag.innerText = `IMKON: ${5 - wordleCurrentRow}`;
      currentInput = '';

      if(wordleCurrentRow >= 5) {
        renderWordle();
        setTimeout(() => endGame(false), 300);
      } else {
        renderWordle();
      }
    }

    /* --- KONTROL VA TUGASH --- */
    function endGame(isWin = false) {
      clearInterval(timerInterval);
      gameState = 'GAMEOVER';
      let title = isWin ? "G'ALABA!" : "O'YIN TUGADI!";
      let secretInfo = (currentGame === 'WORDLE' && !isWin) ? `<div style="font-size:0.8rem; color:#facc15; margin-top:2px;">So'z: ${wordleSecret} edi</div>` : '';

      screenBody.innerHTML = `
        <div style="font-size: 1.1rem; color: ${isWin ? '#4ade80' : '#ef4444'};">${title}</div>
        ${secretInfo}
        <div style="font-size: 0.9rem; margin: 5px 0;">Natija: <b style="color: #4ade80;">${score} ball</b></div>
        <div>
          <button class="action-btn" onclick="saveResult()">Saqlash</button>
          <button class="action-btn exit-btn" onclick="renderMainMenu()">Bosh Menyu</button>
        </div>
      `;
    }

    function saveResult() {
      let savedScores = JSON.parse(localStorage.getItem('miniPcScores') || '[]');
      savedScores.push({ game: currentGame, name: playerName, score: score, date: new Date().toLocaleDateString() });
      localStorage.setItem('miniPcScores', JSON.stringify(savedScores));
      alert("Natija saqlandi!");
      renderMainMenu();
    }

    function handleInput(key) {
      if (currentGame === 'MENU' || gameState === 'GAMEOVER') return;

      if (gameState === 'NAME_INPUT') {
        if (key === 'Backspace') currentInput = currentInput.slice(0, -1);
        else if (key === 'Enter') prepareGame();
        else if (key.length === 1 && currentInput.length < 10) currentInput += key.toUpperCase();
        document.getElementById('input-display').innerText = currentInput + '_';
        return;
      }

      if (currentGame === 'TYPING' || currentGame === 'MATH') {
        if (key === 'Backspace') currentInput = currentInput.slice(0, -1);
        else if (key.length === 1) {
          if (gameState === 'READY') startTimer();
          currentInput += key.toUpperCase();
        }
        screenBody.querySelector('.user-input-display').innerText = currentInput + '_';

        if (currentGame === 'TYPING' && currentInput === currentTarget) { score += 1; scoreTag.innerText = `BALL: ${score}`; nextTask(); }
        if (currentGame === 'MATH' && parseInt(currentInput) === mathAnswer) { score += 1; scoreTag.innerText = `BALL: ${score}`; nextTask(); }
      } 
      else if (currentGame === 'WORDLE') {
        if (key === 'Backspace') {
          currentInput = currentInput.slice(0, -1);
        } else if (key === 'Enter') {
          submitWordleGuess();
          return;
        } else if (/^[a-zA-Z]$/.test(key) && currentInput.length < 5) {
          currentInput += key.toUpperCase();
        }
        renderWordle();
      }
    }

    document.querySelectorAll('.mini-key').forEach(btn => {
      btn.addEventListener('click', () => handleInput(btn.getAttribute('data-key')));
    });

    document.addEventListener('keydown', (e) => {
      let key = e.key;
      if (key === ' ') e.preventDefault();
      let btn = document.querySelector(`.mini-key[data-key="${key.toLowerCase()}"]`) || document.querySelector(`.mini-key[data-key="${key}"]`);
      if (btn) {
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 120);
      }
      handleInput(key);
    });

    renderMainMenu();
  </script>
</body>
</html>
